<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Pseudo Class</title>
    <style>
      .button {
        background-color: orange;
        color: white;
        padding: 5px 10px;
        border-radius: 5px;
      }
      .button:hover {
        background-color: red;
        cursor: pointer;
      }
      input:focus {
        color: blue;
        padding-left: 20px;
        outline: 0;
        border: 2px solid rgb(26, 255, 0);
      }

      a:visited {
        color: red;
      }
      li:nth-child(2n-1) {
        color: red;
      }
    </style>
  </head>
  <body>
    <button class="button">JOIN NOW</button>
    <br />
    <input type="text" name="" id="" />
    <br />
    <input type="text" name="" id="" />
    <br />
    <input type="text" name="" id="" />

  </body>
</html>
